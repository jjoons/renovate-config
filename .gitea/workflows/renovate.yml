name: Self-hosted Renovate

on:
  schedule:
    # Weekdays
    - cron: '21 0-6/3,8 * * 1-5'
    - cron: '21 11-13/2,22 * * 1-5'
    # Weekends
    - cron: '21 6,14,23 * * 0,6'

  workflow_dispatch:
    inputs:
      dry-run:
        description: dry run
        required: false
        default: ''
        type: choice
        options:
          - ''
          - full
      repo-cache:
        description: Repository cache
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - disabled
          - reset
      docker-max-pages:
        description: Docker max pages (positive value)
        default: 10
        type: number

env:
  CACHE_REPOS_DIR: /tmp/renovate/cache/renovate/repository
  CACHE_REPOS_KEY: renovate-repos-cache

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest

    steps:
      - name: Cache Renovate repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-repos
        with:
          path: ${{ env.CACHE_REPOS_DIR }}
          key: ${{ env.CACHE_REPOS_KEY }}.${{ gitea.run_id }}-${{ gitea.run_attempt }}
          restore_keys: |
            ${{ env.CACHE_REPOS_KEY }}.${{ gitea.run_id }}-
            ${{ env.CACHE_REPOS_KEY }}.

      - name: Fix restore Renovate cache ownership
        if: steps.cache-repos.outputs.cache-matched-key != ''
        run: |
          if [ -d "/tmp/renovate/" ]; then
            echo "Fixing ownership: /tmp/renovate/"
            sudo chown -R 12021:0 /tmp/renovate/
          fi

          ls -R "$CACHE_REPOS_DIR" || echo "Renovate repositories cache directory not found: $CACHE_REPOS_DIR"

      - name: Setup Renovate host rules
        id: renovate-host-rules
        env:
          DOCKERHUB_USERNAME: ${{ secrets.RENO_DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.RENO_DOCKERHUB_PASSWORD }}
        run: |
          host_rules='[]'

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            echo "Setup host rule - docker.io"

            host_rules=$(echo "$host_rules" | jq -rc \
              --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_PASSWORD" \
              '. += [{ "hostType": "docker", "matchHost": "docker.io", $username, $password }]'
            )
          else
            echo "Skip setup host rule  - docker.io"
          fi

          total_count=$(echo "$host_rules" | jq -r '. | length')

          echo "total-count=$total_count" | tee -a $GITEA_OUTPUT
          echo "host-rules=$host_rules" >> $GITEA_OUTPUT

      - name: Run self-hosted Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # ========== Self-hosted configurations ==========
          LOG_LEVEL: ${{ vars.RENOVATE_LOG_LEVEL || 'info' }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_DOCKER_MAX_PAGES: ${{ gitea.event.inputs.docker-max-pages || '10' }}
          RENOVATE_DRY_RUN: ${{ gitea.event.inputs.dry-run || '' }}
          RENOVATE_ENDPOINT: ${{ secrets.RENOVATE_ENDPOINT }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          RENOVATE_OPTIMIZE_FOR_DISABLED: true
          RENOVATE_PLATFORM: gitea
          # RENOVATE_REPOSITORIES: '[]'
          RENOVATE_REPOSITORY_CACHE: ${{ gitea.event.inputs.repo-cache || vars.RENOVATE_REPOSITORY_CACHE || 'enabled' }}
          RENOVATE_USERNAME: ${{ secrets.RENOVATE_USERNAME }}
          # ========== Repository configurations ==========
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR }}
          RENOVATE_HOST_RULES: ${{ steps.renovate-host-rules.outputs.host-rules }}
