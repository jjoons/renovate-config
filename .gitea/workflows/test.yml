name: Test

on:
  push:
    paths:
      - .gitea/workflows/test.yml
      - default.json
      - renovate.json
  pull_request:
    paths:
      - .gitea/workflows/test.yml
      - default.json
      - renovate.json
  workflow_dispatch: {}

env:
  cache-key-prefix: renovate-npm

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v6

      - name: Restore global npm assets cache
        id: npm-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: ${{ env.cache-key-prefix }}-${{ hashFiles('.gitea/workflows/test.yml') }}
          restore-keys: |
            ${{ env.cache-key-prefix }}-

      - name: Test Renovate configuration files
        run: |
          renovate_files=(
            "default.json"
            "renovate.json"
          )

          npx --yes -p renovate renovate-config-validator --strict "${renovate_files[@]}"

      - name: Save global npm assets cache
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ env.cache-key-prefix }}-${{ hashFiles('.gitea/workflows/test.yml') }}
