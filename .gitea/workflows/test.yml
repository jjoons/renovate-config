name: Test

on:
  push:
    paths:
      - .gitea/workflows/test.yml
      - default.json
      - renovate.json
  pull_request:
    paths:
      - .gitea/workflows/test.yml
      - default.json
      - renovate.json
  workflow_dispatch: {}

env:
  cache-key-prefix: renovate-npm

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        id: setup-pnpm
        with:
          version: latest

      - name: Cache pnpm packages
        uses: actions/cache@v6
        id: cache-pnpm-packages
        with:
          path: ${{ steps.setup-pnpm.outputs.dest }}
          key: ${{ env.cache-key-prefix }}-${{ hashFiles('.gitea/workflows/test.yml') }}
          restore-keys: |
            ${{ env.cache-key-prefix }}-

      - name: Test Renovate configuration files
        run: |
          renovate_files=(
            "default.json"
            "renovate.json"
          )

          CI=true pnpm dlx --package renovate renovate-config-validator --strict "${renovate_files[@]}"
