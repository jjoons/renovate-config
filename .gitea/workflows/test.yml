name: Test

on:
  push:
    paths:
      - .gitea/workflows/test.yml
      - default.json
      - renovate.json
  pull_request:
    paths:
      - .gitea/workflows/test.yml
      - default.json
      - renovate.json
  workflow_dispatch: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        id: setup-pnpm
        with:
          version: latest

      - name: Cache pnpm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-pnpm-packages
        with:
          path: ${{ steps.setup-pnpm.outputs.dest }}
          key: ${{ runner.os }}-renovate-pnpm.${{ hashFiles('.gitea/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-renovate-pnpm.

      - name: Test Renovate configuration files
        run: |
          renovate_files=(
            "default.json"
            "renovate.json"
          )

          CI=true pnpm dlx --package renovate renovate-config-validator --strict "${renovate_files[@]}"
