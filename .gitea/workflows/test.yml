name: Test

on:
  push:
    paths:
      - .gitea/workflows/test.yml
      - default.json
      - renovate.json
  pull_request:
    paths:
      - .gitea/workflows/test.yml
      - default.json
      - renovate.json
  workflow_dispatch: {}

env:
  cache-key-prefix: renovate-npm

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Test Renovate configuration files
        run: |
          renovate_files=(
            "default.json"
            "renovate.json"
          )

          CI=true pnpm dlx --package renovate renovate-config-validator --strict "${renovate_files[@]}"
