name: Test

on:
  push:
    paths:
      - default.json
      - renovate.json
  pull_request:
    paths:
      - default.json
      - renovate.json
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config:
          - file: default.json
          - file: renovate.json

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v6

      - name: Test Renovate configuration file - ${{ matrix.config.file }}
        run: |
          RENOVATE_CONFIG_FILE="${{ matrix.config.file }}" npx --yes -p renovate renovate-config-validator
